<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Echo · Fight for Knowledge</title>
    <script>
        (function () {
            try {
                var theme = localStorage.getItem("ffk.theme");
                var lang = localStorage.getItem("ffk.lang");
                document.documentElement.dataset.theme = theme === "light" ? "light" : "dark";
                document.documentElement.lang = lang === "fa" ? "fa" : "en";
                document.documentElement.dir = lang === "fa" ? "rtl" : "ltr";
            } catch (e) {
                document.documentElement.dataset.theme = "dark";
            }
        })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../assets/style.css" />
</head>
<body class="chat-page" data-character="echo" data-accent="echo">

    <script src="../assets/characters.js"></script>
    <script src="../assets/common.js"></script>
    <script src="../assets/chat.js"></script>

</body>
</html>
